[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuropulse-inference"
version = "0.2.0"
description = "NeuroPulse inference API — TRIBE v2 + cortical atlas + advertiser metrics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "Pillow>=10.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "supabase>=2.4",
    "nibabel>=5.2",
    "nilearn>=0.10.4",
    # TRIBE v2 — install separately:
    #   pip install git+https://github.com/facebookresearch/tribev2.git
    # NOTE: license CC-BY-NC-4.0. Use limited to research / pitch demos to Meta.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
